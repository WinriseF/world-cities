<body>
<canvas id="globe" tabindex="0" aria-label="Interactive globe. Drag to rotate, scroll or pinch to zoom, select a city."></canvas>
<header class="overlay brand">
  <h1>World Cities</h1>
  <p class="metrics"><span><strong id="city-total">—</strong> locations</span><span class="sep">·</span><span><strong id="country-total">—</strong> countries &amp; territories</span><span class="sep">·</span><span><strong id="region-total">—</strong> regions</span></p>
</header>
<aside class="overlay panel" aria-label="Explore locations">
  <section class="card search-card">
    <div class="panel-title"><h2>Explore <span style="color:var(--muted);font-weight:400">· 检索</span></h2><a id="version" class="version" href="https://www.npmjs.com/package/@winrisef/world-cities" target="_blank" rel="noreferrer">npm</a></div>
    <label class="search-field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4 4" stroke-linecap="round"/></svg><input id="search" type="search" aria-label="Search locations" placeholder="Search · 中文 / English / 拼音" autocomplete="off" disabled></label>
    <div class="filters"><select id="country" aria-label="Country or territory" disabled><option value="">All countries</option></select><select id="region" aria-label="Administrative region" disabled><option value="">All regions</option></select></div>
    <div class="search-footer"><span id="load-state" role="status"><span class="status-dot loading"></span>Connecting to CDN</span><button class="text-button" id="reset" type="button">Reset view</button></div>
    <div class="progress" id="progress"><span id="progress-bar"></span></div>
  </section>
  <section id="detail" class="card detail-card" hidden aria-live="polite"><div class="detail-top"><div><div id="detail-kind" class="detail-eyebrow">Location</div><h2 id="detail-title" class="detail-title"></h2><div id="detail-subtitle" class="detail-subtitle"></div></div><button type="button" id="close-detail" class="icon-button" title="Clear selection" aria-label="Clear selection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="coords"><div><label>Latitude · 纬度</label><strong id="latitude"></strong></div><div><label>Longitude · 经度</label><strong id="longitude"></strong></div></div><p id="detail-extra" class="detail-extra"></p></section>
  <section id="result-card" class="card result-card" hidden><div class="result-heading"><span id="result-count">Locations</span><button id="fit-results" class="text-button" type="button">Fit results</button></div><div class="results" id="results"></div><button id="more" class="more" type="button" hidden>Show more</button></section>
</aside>
<div class="overlay legend"><div class="legend-wrap"><div class="legend-row"><span title="Reference rosters checked"><i class="dot verified"></i>Verified</span><span title="Major-city selection"><i class="dot major"></i>Major cities</span><span class="na-label" title="No applicable city-level scope"><i class="dot na"></i>N/A</span></div><div class="credits"><a href="https://github.com/WinriseF/world-cities" target="_blank" rel="noreferrer">GitHub ↗</a><a href="https://www.npmjs.com/package/@winrisef/world-cities" target="_blank" rel="noreferrer">npm ↗</a><a href="https://www.naturalearthdata.com/about/disputed-boundaries-policy/" title="Natural Earth 1:50m boundaries, China point of view; cartographic reference" target="_blank" rel="noreferrer">Natural Earth</a></div></div></div>
<div class="overlay map-tools" aria-label="Map navigation"><button id="zoom-out" class="icon-button" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button><span class="zoom-value" id="zoom-value">1.0×</span><button id="zoom-in" class="icon-button" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button><div class="divider"></div><button id="fit" class="icon-button" type="button" title="Fit current view" aria-label="Fit current view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="6"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg></button></div>
<div id="hover" class="map-tip" hidden></div><div id="marker" class="marker" hidden></div><div id="notice" class="notice" hidden></div>
<script type="module">
const VERSION = '0.1.136'
const BASE = `https://cdn.jsdelivr.net/npm/@winrisef/world-cities@${VERSION}/data/`
const FALLBACK = `https://unpkg.com/@winrisef/world-cities@${VERSION}/data/`
const NE = 'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/'
const LAND = NE+'ne_50m_land.geojson'
const BORDERS = NE+'ne_50m_admin_0_boundary_lines_land.geojson'
const DISPUTED = NE+'ne_50m_admin_0_boundary_lines_disputed_areas.geojson'
const COUNTRIES = NE+'ne_50m_admin_0_map_units.geojson'
const DETAILED_COUNTRIES = NE+'ne_10m_admin_0_map_units.geojson'
const $ = id => document.getElementById(id)
const canvas = $('globe'), country = $('country'), region = $('region'), search = $('search')
const fmt = n => n.toLocaleString('en-US')
const rad = Math.PI/180, deg = 1/rad
const clamp = (v,a,b) => Math.max(a,Math.min(b,v))
const normalize = s => String(s??'').normalize('NFD').replace(/\p{M}/gu,'').replace(/[\s'-]+/g,'').toLowerCase()
const color = {'reference-checked':[.43,.90,.76],'major-cities':[.96,.73,.36],'not-applicable':[.51,.59,.68],partial:[.96,.73,.36],pending:[.56,.65,.83]}
const unit = (lon,lat) => {const x=lon*rad,y=lat*rad,c=Math.cos(y);return [c*Math.cos(x),Math.sin(y),c*Math.sin(x)]}
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2]
const create = (tag,cls,text) => {const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
async function json(url) {const r=await fetch(url);if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()}
async function data(file) {try{return await json(BASE+file)}catch{return json(FALLBACK+file)}}
function error(message) {const box=$('notice');box.replaceChildren(create('strong','',message),create('div','','Check the connection and try again.'));const button=create('button','text-button','Reload');button.onclick=()=>location.reload();box.append(button);box.hidden=false}
$('version').textContent=`v${VERSION}`
const gl=canvas.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:false})
if(!gl){error('WebGL is unavailable');throw new Error('WebGL unavailable')}
function program(v,f) {
  function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
  const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,v));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p
}
const earth=program(`attribute vec2 a_position;void main(){gl_Position=vec4(a_position,0.,1.);}`,`
precision highp float;
uniform vec2 u_size,u_center;uniform float u_radius;uniform vec3 u_right,u_up,u_front;uniform sampler2D u_land,u_selection;
const float PI=3.14159265359;
void main(){
  vec2 q=(gl_FragCoord.xy-u_center)/u_radius;float r=length(q),m=dot(q,q);
  vec3 bg=mix(vec3(.024,.043,.071),vec3(.045,.073,.106),exp(-m*.7));
  if(r>1.){float glow=exp(-(r-1.)*44.);gl_FragColor=vec4(bg+vec3(.024,.073,.11)*glow,1.);return;}
  float z=sqrt(max(0.,1.-m));vec3 n=q.x*u_right+q.y*u_up+z*u_front;
  float phi=asin(clamp(n.y,-1.,1.)),theta=atan(n.z,n.x);vec2 uv=vec2(theta/(2.*PI)+.5,phi/PI+.5);
  float land=texture2D(u_land,uv).r;
  vec3 ocean=vec3(.055,.102,.16),ground=vec3(.148,.236,.276);
  vec3 color=mix(ocean,ground,smoothstep(.15,.85,land));
  float shore=smoothstep(.02,.5,land)*(1.-smoothstep(.53,.98,land));color+=shore*vec3(.045,.085,.09);
  float selected=texture2D(u_selection,uv).r;vec2 stepUV=vec2(min(.001,1.5/(u_radius*6.2831853)),min(.0015,1.5/(u_radius*3.14159265)));
  float edge=max(max(abs(selected-texture2D(u_selection,uv+vec2(stepUV.x,0.)).r),abs(selected-texture2D(u_selection,uv-vec2(stepUV.x,0.)).r)),max(abs(selected-texture2D(u_selection,uv+vec2(0.,stepUV.y)).r),abs(selected-texture2D(u_selection,uv-vec2(0.,stepUV.y)).r)));
  color=mix(color,vec3(.15,.35,.34),selected*.32);
  float light=.58+.42*max(0.,dot(vec3(q,z),normalize(vec3(-.55,.5,1.))));
  float meridian=abs(fract(theta/(PI/6.)+.5)-.5),parallel=abs(fract(phi/(PI/6.)+.5)-.5);
  float grid=1.-smoothstep(.0006,.004,min(meridian,parallel));color=mix(color,vec3(.31,.43,.49),grid*.19);
  color*=light*(.66+.34*z);color+=vec3(.04,.115,.16)*pow(1.-z,4.);color=mix(color,vec3(.49,.87,.79),edge*.32);gl_FragColor=vec4(color,1.);
}`)
const points=program(`attribute vec3 a_vec,a_color;uniform vec3 u_right,u_up,u_front;uniform vec2 u_size,u_center;uniform float u_radius,u_point;varying vec3 v_color;varying float v_depth;
void main(){float z=dot(a_vec,u_front);if(z<=0.){gl_Position=vec4(3.,3.,0.,1.);gl_PointSize=1.;v_depth=0.;v_color=a_color;return;}vec2 p=vec2(dot(a_vec,u_right),dot(a_vec,u_up));gl_Position=vec4((u_center+p*u_radius)/u_size*2.-1.,0.,1.);gl_PointSize=u_point;v_color=a_color;v_depth=z;}`,`
precision mediump float;varying vec3 v_color;varying float v_depth;uniform float u_opacity;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;float a=(1.-smoothstep(.1,.5,r))*(.55+.45*v_depth);gl_FragColor=vec4(v_color,a*u_opacity);}`)
// Project actual border line segments on the same sphere as the city points.
const lines=program(`attribute vec3 a_vec;attribute float a_dist;uniform vec3 u_right,u_up,u_front;uniform vec2 u_size,u_center;uniform float u_radius;varying float v_depth,v_dist;
void main(){v_depth=dot(a_vec,u_front);v_dist=a_dist;vec2 p=vec2(dot(a_vec,u_right),dot(a_vec,u_up));gl_Position=vec4((u_center+p*u_radius)/u_size*2.-1.,0.,1.);}`,`
precision highp float;varying float v_depth,v_dist;uniform vec4 u_color;uniform float u_radius,u_dash;void main(){if(v_depth<=0.||(u_dash>0.5&&fract(v_dist*u_radius/7.)>.55))discard;gl_FragColor=vec4(u_color.rgb,u_color.a*min(1.,v_depth*4.));}`)
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW)
const buffer=gl.createBuffer(),contextBuffer=gl.createBuffer(),texture=gl.createTexture(),selectionTexture=gl.createTexture()
function initMask(tex,slot){gl.activeTexture(gl.TEXTURE0+slot);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)}
initMask(texture,0);initMask(selectionTexture,1)
// Rasterize real country or land polygons without embedding geographic data.
function geometryMask(features,tex,slot){
  const mask=document.createElement('canvas');mask.width=4096;mask.height=2048;const ctx=mask.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,mask.width,mask.height);ctx.fillStyle='#fff'
